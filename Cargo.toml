[package]
name = "fvim"
version = "0.2.0"
edition = "2021"
publish = false

[dependencies]
crossterm = "=0.29.0"
regex = { version = "=1.13.1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
unicode-width = "=0.2.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
