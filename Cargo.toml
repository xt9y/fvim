[package]
name = "fvim"
version = "0.6.1"
edition = "2021"
publish = false

[dependencies]
crossterm = "=0.29.0"
regex = { version = "=1.13.1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
unicode-width = "=0.2.2"
mlua = { version = "=0.12.1", default-features = false, features = ["lua54", "vendored"] }
serde_json = "=1.0.151"
tree-sitter = "=0.27.0"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-lua = "=0.5.0"
tree-sitter-zig = "=1.1.2"
tree-sitter-odin = "=1.3.0"
tree-sitter-bash = "=0.25.1"
tree-sitter-json = "=0.24.8"
tree-sitter-md = "=0.5.3"
tree-sitter-hlsl = "=0.2.0"
shell-words = "=1.1.1"
libc = "=0.2.189"
portable-pty = "=0.9.0"
vt100 = "=0.16.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
