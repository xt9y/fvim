name: TEST

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: '1'

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-slim
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
          - ubuntu-22.04-arm
          - ubuntu-24.04-arm
          - ubuntu-26.04-arm
          - windows-2022
          - windows-2025
          - windows-2025-vs2026
          - windows-11-arm
          - windows-11-vs2026-arm
          - macos-14
          - macos-15
          - macos-26
          - macos-15-intel
          - macos-26-intel
          - xcode-27
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: GNU make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install make --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH

      - name: Build on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: make

      - name: Unit tests and performance probes on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          make test
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --release --locked -- --ignored --nocapture

      - name: Installation and terminal tests on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: python3 scripts/test.py

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          make
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Unit tests and performance probes on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          make test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          cargo test --release --locked -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Installation and terminal tests on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rust formatting and lint
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup component add rustfmt clippy
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
