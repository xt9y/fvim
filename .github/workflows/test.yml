name: TEST

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-slim
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
          - ubuntu-22.04-arm
          - ubuntu-24.04-arm
          - ubuntu-26.04-arm
          - windows-2022
          - windows-2025
          - windows-2025-vs2026
          - windows-11-arm
          - windows-11-vs2026-arm
          - macos-14
          - macos-15
          - macos-26
          - macos-15-intel
          - macos-26-intel
          - xcode-27
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: GNU make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install make --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH

      - name: Build and test on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          make
          make test
          python3 scripts/test.py

      - name: Build and test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          make
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          make test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Format source for initial bootstrap
        if: always() && matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup component add rustfmt
          cargo fmt
          python3 - <<'PY'
          import json
          from pathlib import Path
          print("FVIM_FORMAT=" + json.dumps({str(p): p.read_text() for pattern in ("src/*.rs", "tests/*.rs") for p in Path(".").glob(pattern)}))
          PY
